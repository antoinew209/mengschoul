<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tes révisions</title>
<meta name="theme-color" content="#161514">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Révisions">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: phone-first single column; home = today's reviews + scan + subjects; subject = fiches + quizzes; quiz = one question per screen */
:root {
  --bg: #f6f5f2; --card: #ffffff; --fg: #1d1b1a; --muted: #6b6560; --line: #e2ddd6; --chip: #efe9e2;
  --gold: #e0a400; --ok: #1f7a4a; --ok-bg: #e6f3eb; --bad: #b3122e; --bad-bg: #fbe8eb;
  --de: #b3122e; --fr: #1f4fb3; --ma: #6a3fb5; --sc: #0f7a6c; --ar: #be185d; --ia: #c2410c; --ge: #8a5a14;
  --fn-s: #1d5fd6; --fn-cod: #d0192f; --fn-coi: #12823e;
  --accent: var(--fg);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --card: #211f1d; --fg: #f1ede8; --muted: #a8a19a; --line: #38342f; --chip: #2c2926;
    --gold: #f2c14e; --ok: #5fd08f; --ok-bg: #173323; --bad: #ff6b7d; --bad-bg: #3a1b20;
    --de: #ff5a6e; --fr: #7aa2ff; --ma: #b99bff; --sc: #4fd1bf; --ar: #f472b6; --ia: #ff8a4c; --ge: #e0b26b;
    --fn-s: #6cb4ff; --fn-cod: #ff6b6b; --fn-coi: #4fdc8a;
    color-scheme: dark;
  }
}
[data-m="allemand"] { --accent: var(--de); }
[data-m="francais"] { --accent: var(--fr); }
[data-m="mathematiques"] { --accent: var(--ma); }
[data-m="sciences"] { --accent: var(--sc); }
[data-m="agenda"] { --accent: var(--gold); }
[data-m="arts"] { --accent: var(--ar); }
[data-m="ia"] { --accent: var(--ia); }
[data-m="geschichte"] { --accent: var(--ge); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
/* Installed on the home screen the page runs under the phone's status bar: keep that strip opaque. */
body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
main { display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.back { font: inherit; font-weight: 700; border: 0; background: var(--chip); color: var(--fg); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
h1 { font-family: var(--display); font-weight: 800; font-size: 24px; margin: 0; letter-spacing: -0.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.muted { color: var(--muted); }
.small { color: var(--muted); font-size: 14px; margin: 0; }
#ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 8px); transform: translate(-50%, -80px); transition: transform .2s; z-index: 20; pointer-events: none;
  background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; white-space: nowrap; }
.pgwin { margin: 0; color: var(--ok); font-weight: 700; }
.pglost { margin: 0; color: var(--bad); font-weight: 700; }
#ptr.show { transform: translate(-50%, 0); }
#swb { position: fixed; left: 6px; top: 50%; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 700;
  background: var(--card); color: var(--fg); border: 2px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .25); opacity: 0; transform: translate(-40px, -50%); z-index: 20; pointer-events: none; }
#swb.go { background: var(--fg); color: var(--bg); }
#avion { text-align: center; color: var(--muted); font-size: 13px; margin: 20px 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.tip { background: var(--chip); border-radius: 12px; padding: 10px 12px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.tip button { font: inherit; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 18px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tiles > .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.tile { font: inherit; text-align: left; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 16px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-family: var(--display); font-size: 17px; }
.tile span { color: var(--muted); font-size: 14px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { font: inherit; color: var(--fg); text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .txt small { color: var(--muted); font-size: 14px; }
.more { font: inherit; font-size: 15px; font-weight: 700; color: var(--fg); background: var(--chip); border: 0; border-radius: 14px; padding: 10px 14px; cursor: pointer; text-align: center; }
.badge { font-size: 14px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; background: var(--chip); color: var(--muted); font-variant-numeric: tabular-nums; }
.badge.good { background: var(--ok-bg); color: var(--ok); }
.badge.mid { background: var(--chip); color: var(--fg); }
.badge.low { background: var(--bad-bg); color: var(--bad); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.due { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.due li { display: flex; align-items: center; gap: 10px; }
.due li .grow { flex: 1; min-width: 0; }
.due.today .grow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps { display: flex; gap: 10px; font-size: 13px; flex: none; }
.steps span { color: var(--muted); white-space: nowrap; font-weight: 600; }
.steps span.on { color: var(--ok); }
.due li.fait .grow { color: var(--muted); text-decoration: line-through; }
.due.today li.sub { padding-left: 20px; font-size: 14px; margin-top: -5px; }
.card h3.grp { font-family: var(--display); font-size: 16px; margin: 4px 0 -2px; color: var(--accent); }
[hidden] { display: none !important; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 28px; flex: none; }
.spark i { width: 5px; border-radius: 2px; background: var(--accent); }
.spark i.ok { background: var(--ok); }
.spark i.low { opacity: .45; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.tabs button { font: inherit; font-size: 15px; font-weight: 700; padding: 7px 12px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--fg); white-space: nowrap; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.empty-tile span { color: var(--accent); font-weight: 700; }
/* The tab bar is the page's last block, stuck to the bottom: the page always fills the screen (short tabs too), so the
   bar sits at the very bottom whatever the tab; no position: fixed, which the iPhone app places badly on short pages. */
body.hasnav { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
body.hasnav .wrap { flex: 1 0 auto; width: 100%; box-sizing: border-box; padding-bottom: 16px; }
#nav { position: sticky; bottom: 0; z-index: 15; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
#nav button { font: inherit; font-size: 11px; font-weight: 700; color: var(--muted); background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 4px 0; }
#nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#nav button[aria-current="page"] { color: var(--fg); }
.strip { font: inherit; color: var(--fg); text-align: left; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 14px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.strip .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.strip b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .tag { font-size: 10px; padding: 3px 5px; }
.strip small { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .cd { flex: none; font-size: 13px; font-weight: 700; background: var(--chip); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.mission .step { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 16px; font-size: 17px; }
.mission .step small { font-size: 14px; font-weight: 600; opacity: .7; }
.link { font: inherit; font-size: 15px; font-weight: 700; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 0; text-align: left; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 0; }
.legend .ok, .nl .n-ok .st { color: var(--ok); }
.subj { gap: 6px; }
.subj .grp-row { border-top: 0; padding-top: 0; }
.nl li .st { width: 22px; flex: none; text-align: center; font-size: 18px; font-weight: 700; color: var(--muted); }
.nl li.n-half .st { color: var(--gold); }
.nl li.n-ok .grow { color: var(--muted); text-decoration: line-through; }
.dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.dayprog { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.dayprog > div { height: 100%; background: var(--ok); border-radius: 3px; }
.start { margin: 2px 0 -4px; }
.grp-row { display: flex; align-items: center; gap: 8px; cursor: pointer; padding-top: 8px; border-top: 1px solid var(--line); }
.grp-row h3.grp { flex: 1; margin: 0; }
.grp-row .chev { color: var(--muted); font-size: 20px; line-height: 1; transition: transform .15s; }
.grp-row.open .chev { transform: rotate(90deg); }
.ag .meta .cd { color: var(--fg); background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.due.today li.sub .grow { color: var(--muted); }
.chev { color: var(--muted); font-weight: 700; }
.lnk { cursor: pointer; }  /* a row that opens something (not the green .go button) */
.empty { color: var(--muted); margin: 0; }
/* fiches: swipeable cards rendered from data */
.fcards { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.fcards::-webkit-scrollbar { display: none; }
.fcard { flex: 0 0 100%; scroll-snap-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; max-height: calc(100dvh - 150px); overflow-y: auto; }
.fcard > .fhead { background: var(--accent); color: #fff; padding: 12px 14px; font-family: var(--display); font-weight: 800; font-size: 20px; display: flex; justify-content: space-between; gap: 10px; }
.fcard > .fhead span { font-family: var(--body); font-weight: 400; font-size: 14px; opacity: .85; align-self: center; }
.fbody { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.fbody h3 { font-family: var(--display); font-size: 18px; margin: 6px 0 0; color: var(--accent); border-bottom: 2px solid var(--line); padding-bottom: 2px; }
.fbody p { margin: 0; }
.fbody ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.fbody b { color: var(--accent); }
/* Sentence functions, same colours everywhere: [s]sujet[/s] blue, [cod]…[/cod] red, [coi]…[/coi] green. */
.fn-s, .fn-cod, .fn-coi { font-weight: 700; }
.fn-s { color: var(--fn-s); } .fn-cod { color: var(--fn-cod); } .fn-coi { color: var(--fn-coi); }
.tscroll { overflow-x: auto; }
.fbody table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
.fbody th { text-align: left; background: var(--chip); padding: 5px 8px; white-space: nowrap; }
.fbody td { padding: 5px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
.pager { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 15px; margin: 0; }
/* quiz */
.flag { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.flag > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.chip { align-self: flex-start; background: var(--chip); color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.q { font-size: 20px; margin: 0; }
.q b { color: var(--accent); }
.hint { color: var(--muted); font-size: 16px; margin: -6px 0 0; }
.audio { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.audio .sec { flex: 1 1 0; width: auto; padding: 11px 8px; }
.qb { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.qb .q { margin: 0; }
.heard { margin-top: 8px; font-size: 16px; color: var(--muted); }
.heard b { color: var(--fg); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { font: inherit; text-align: left; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.opt[aria-pressed="true"] { border-color: var(--fg); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
input[type=text], textarea { font: inherit; font-size: 22px; width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
input[type=text]:focus, textarea:focus { outline: none; border-color: var(--fg); }
input.right { border-color: var(--ok); background: var(--ok-bg); }
input.wrong { border-color: var(--bad); background: var(--bad-bg); }
.keys { display: flex; gap: 8px; flex-wrap: wrap; }
.keys button { font: inherit; font-size: 20px; min-width: 48px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
.fb { border-radius: 12px; padding: 12px 14px; font-size: 17px; }
.fb.ok { background: var(--ok-bg); color: var(--ok); }
.fb.ko { background: var(--bad-bg); color: var(--fg); }
.fb strong { display: block; margin-bottom: 2px; }
.fb.ko strong { color: var(--bad); }
.fb .why { display: block; }
.fb .rule { display: block; margin-top: 6px; font-size: 15px; color: var(--muted); }
.main { font: inherit; font-weight: 700; font-size: 18px; padding: 13px; border-radius: 14px; border: 0; background: var(--fg); color: var(--bg); cursor: pointer; width: 100%; text-align: center; display: block; }
.main:disabled { opacity: .35; cursor: default; }
.sec { font: inherit; font-weight: 700; padding: 11px; border-radius: 14px; border: 2px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; width: 100%; text-align: center; display: block; }
.go { background: #1f9d55; color: #fff; border: 0; }
#act { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
#act:disabled { opacity: 1; background: var(--chip); color: var(--muted); }
.score { font-family: var(--display); font-weight: 800; font-size: 52px; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.score small { font-size: 26px; color: var(--muted); }
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.trow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 15px; }
.trow .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.trow .bar > div { height: 100%; }
.trow .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.errs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; }
.errs s { color: var(--bad); }
.rec { margin: 0; color: var(--muted); }
.rec b { color: var(--fg); font-variant-numeric: tabular-nums; }
.rec.win { color: var(--fg); font-weight: 800; font-size: 18px; }
.rec .star { color: var(--gold); }
.pieges { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.pieges li { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; }
.pieges li > .small { grid-column: 2 / -1; }
.pips { display: flex; gap: 4px; }
.pips i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); box-sizing: border-box; }
.pips i.on { background: var(--accent); }
.fb .pg { display: block; margin-top: 6px; font-size: 15px; font-weight: 700; }
.errs b { color: var(--ok); }
details > summary { cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 18px; }
.sent { font-weight: 700; margin: 0; }
.sent.ok { color: var(--ok); }
.sent.ko { color: var(--bad); }
/* agenda */
.ag { display: flex; align-items: center; gap: 10px; }
.ag .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.due li.ag { align-items: flex-start; }
.ag small, .ag .meta { color: var(--muted); font-size: 14px; }
/* Tag and button sit inside the text column, so the details get the full width. */
.ag .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ag .meta .tag { padding: 2px 6px; }
.ag .txt .mini { align-self: flex-start; margin-top: 6px; }
.ag .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
/* Home « À venir »: her long notes (up to 255 characters) on 2 lines; the agenda page shows them in full. */
.due.soon .ag b { font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ag .btns .mini { margin-top: 0; }
.days { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.days .mini { color: var(--bg); }
.tile.on { background: var(--accent); color: #fff; }
#nday { font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
#ntitle { font-size: 17px; resize: vertical; }
button.main:disabled { opacity: .5; cursor: default; }
.ag .mini.alt { background: transparent; color: var(--fg); border: 2px solid var(--line); }
.ag.late .meta { color: var(--bad); font-weight: 700; }
.ag.done b { text-decoration: line-through; color: var(--muted); }
.chk { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--accent); background: transparent; color: transparent; font: inherit; font-weight: 800; cursor: pointer; flex: none; }
.chk[aria-pressed="true"] { background: var(--accent); color: #fff; }
.tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #fff; background: var(--accent); border-radius: 6px; padding: 4px 6px; flex: none; }
.mini { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 999px; padding: 6px 12px; background: var(--accent); color: #fff; cursor: pointer; flex: none; }
.edt { display: flex; flex-wrap: wrap; gap: 6px; }
.ask { display: flex; flex-direction: column; gap: 8px; }
.ask + .ask { border-top: 1px solid var(--line); padding-top: 12px; }
.ask q { font-style: italic; color: var(--muted); }
.ask .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.ask .opts .mini.alt, .days .mini.alt { background: transparent; color: var(--fg); border: 2px solid var(--line); }
.edt span { background: var(--chip); border-left: 4px solid var(--accent); border-radius: 6px; padding: 3px 8px; font-size: 14px; }
/* progress */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.chart { position: relative; display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 18px; border-bottom: 2px solid var(--line); }
/* Same box as the bars (below the label room), so the line sits exactly at 80 % of a bar's full height. */
.chart .goal { position: absolute; left: 0; right: 0; top: 18px; bottom: 0; pointer-events: none; }
.chart .goal::before { content: ""; position: absolute; left: 0; right: 0; bottom: 80%; border-top: 2px dashed var(--muted); opacity: .5; }
.chart-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-h span { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); white-space: nowrap; }
.col { flex: 1; max-width: 56px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; position: relative; }
.col i { font-style: normal; font-size: 12px; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.col div { width: 100%; border-radius: 6px 6px 0 0; background: var(--accent); }
.col div.low { opacity: .45; }
.col div.goal-ok { background: var(--ok); }
.cols-x { display: flex; gap: 8px; }
.cols-x span { flex: 1; max-width: 56px; text-align: center; font-size: 13px; color: var(--muted); }
/* scan */
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.thumbs figure { margin: 0; position: relative; }
.thumbs img, .thumbs .pdf { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
.thumbs .pdf { display: grid; place-items: center; background: var(--line); font-weight: 700; font-size: 18px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.thumbs figcaption { position: absolute; top: 4px; left: 4px; background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
.thumbs button { position: absolute; top: 2px; right: 2px; border: 0; border-radius: 50%; width: 26px; height: 26px; background: rgba(0, 0, 0, .6); color: #fff; font-size: 15px; cursor: pointer; }
.cam { position: relative; overflow: hidden; }
.cam input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; width: 0; background: #1f9d55; transition: width .3s; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .flag > div, .progress > div { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="root">
  <header><button class="back" id="back" aria-label="Retour" hidden>←</button><h1 id="h1">Tes révisions</h1><span class="count" id="count"></span></header>
  <main id="app"></main>
</div>

<script>
// Data comes from the Google Apps Script web app; the last copy is kept on the phone so the page
// shows at once (even offline) and is refreshed in the background.
const EXEC = "https://script.google.com/macros/s/AKfycbyrXvqdwXXtxt1GDKsNZqPEVr4zBOTBlcDsCS2qfgU-6W4TKBAADx403CEBaTuorQcWOg/exec";
// Her link carries the key (…/mengschoul/#k=…), so this public code holds none; it stays on the phone after the first visit.
const KEY = (() => {
  const m = /[#&]k=([\w-]+)/.exec(location.hash);
  try { if (m) localStorage.setItem("ms-key", m[1]); return m ? m[1] : localStorage.getItem("ms-key") || ""; }
  catch (e) { return m ? m[1] : ""; }
})();
let DATA, SUBJ, QUIZ, FICHE;
const BUILD = "28/10 12h47";
const TODAY = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Luxembourg' });

const KEYS = { de: ["ä","ö","ü","ß"], fr: ["é","è","ê","à","â","ç","ù","î","ô","œ"] };
const app = document.getElementById("app"), root = document.getElementById("root");
const h1 = document.getElementById("h1"), count = document.getElementById("count"), back = document.getElementById("back");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(s|cod|coi)\](.+?)\[\/\1\]/g, '<span class="fn-$1">$2</span>');
function index(d) {
  DATA = applyOutbox(d);  // ticks and results still waiting to be sent show as done
  SUBJ = Object.fromEntries(DATA.subjects.map(s => [s.key, s]));
  QUIZ = {}; FICHE = {};
  DATA.subjects.forEach(s => { s.quizzes.forEach(q => QUIZ[q.id] = { ...q, subject: s }); s.fiches.forEach(f => FICHE[f.id] = { ...f, subject: s }); });
}
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

function badge(q) {
  if (!q.score) return `<span class="badge">À faire</span>`;
  const r = q.score[0] / q.score[1];
  return `<span class="badge ${r >= .9 ? "good" : r >= .6 ? "mid" : "low"}">${q.score[0]}/${q.score[1]}</span>`;
}

// In-page navigation stack of tokens: "" | m-<subject> | q-<quiz id> | f-<fiche id> | scan | scan-<subject> | scan-<subject>-<kind>
const stack = [];
let updateReady = false;  // a new version is waiting: loaded when she is back on the home page
let shownView = null;  // a background refresh redraws the same view: keep where she has scrolled to
function go(token) { hush(); if (token) stack.push(token); else stack.length = 0; shownView = null; render(); }
back.onclick = () => { hush(); stack.pop(); render(); };

function render() {
  const t = stack[stack.length - 1] || "";
  if (t !== shownView) { window.scrollTo(0, 0); shownView = t; }
  count.textContent = "";
  navBar(t);
  if (t === "matieres") return matieresView();
  if (t.startsWith("m-") && SUBJ[t.slice(2)]) return subjectView(SUBJ[t.slice(2)]);
  if (t.startsWith("q-") && QUIZ[t.slice(2)]) return quizIntro(QUIZ[t.slice(2)]);
  if (t.startsWith("f-") && FICHE[t.slice(2)]) return ficheView(FICHE[t.slice(2)]);
  if (t.startsWith("fa-") && FICHE[t.slice(3)]) return ficheView(FICHE[t.slice(3)], true);
  if (t.startsWith("fp-")) return piegeView(t.slice(3));
  if (t.startsWith("nt-")) {
    const [key, th] = t.slice(3).split("~"), tc = SUBJ[key] && themeCard(SUBJ[key], decodeURIComponent(th));
    return tc ? ficheView(tc.f, tc.all, tc.k) : home();
  }
  if (t === "scan") return scanSubject();
  if (t === "progres") return progress();
  if (t === "agenda") return agendaView();
  if (t === "ajout") return addTestView();
  if (t.startsWith("scan-")) return scanStep(t.slice(5));
  home();
}
function setFrame(title, m, showBack) {
  h1.textContent = title;
  if (m) root.dataset.m = m; else delete root.dataset.m;
  back.hidden = !showBack;
  fitTitle();
}
// The title always stays on one line: shrink it until it fits (« Révisions avant contrôle » on a phone).
function fitTitle() {
  h1.style.fontSize = "";
  for (let px = 23; h1.scrollWidth > h1.clientWidth && px >= 15; px--) h1.style.fontSize = px + "px";
}
addEventListener("resize", fitTitle);
function wire() { app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go)); }


// ---------- home, version 2 (since 27/10; localStorage home2=0 brings the old home back) ----------
// One next step at a time (read the fiches of the day, then the quiz), the tests as one-line strips, one card per
// subject with one line per notion, and a tab bar at the bottom for the rest of the app.
const home2On = () => store.get("home2") !== "0";
const NAV = [["", "Aujourd'hui", "M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"], ["matieres", "Matières", "M4 4h7v16H4zM13 4h7v16h-7z"],
  ["scan", "Scanner", "M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"], ["agenda", "Agenda", "M4 6h16v14H4zM4 10h16M8 3v5M16 3v5"],
  ["progres", "Progrès", "M4 20V10M10 20V4M16 20v-8M22 20H2"]];
function navBar(t) {
  let nav = document.getElementById("nav");
  if (!home2On()) { if (nav) nav.remove(); document.body.classList.remove("hasnav"); return; }
  if (!nav) { nav = document.createElement("nav"); nav.id = "nav"; document.body.appendChild(nav); }
  const top = NAV.some(n => n[0] === t);
  nav.hidden = !top; document.body.classList.toggle("hasnav", top);
  nav.innerHTML = NAV.map(([k, label, d]) => `<button data-nav="${k}" aria-current="${k === t ? "page" : "false"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg><span>${label}</span></button>`).join("");
  nav.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { stack.length = 0; if (b.dataset.nav) stack.push(b.dataset.nav); shownView = null; render(); });
}
function matieresView() {
  setFrame("Tes matières", null, false);
  app.innerHTML = `<div class="tiles">${DATA.subjects.map(s => !s.fiches.length && !s.quizzes.length && s.scan !== false
    ? `<button class="tile empty-tile" data-m="${s.key}" data-go="scan-${s.key}"><b>${esc(s.name)}</b><span>Scanne ton premier cours ›</span></button>`
    : `<button class="tile" data-m="${s.key}" data-go="m-${s.key}"><b>${esc(s.name)}</b><span>${((n) => `${n} fiche${n > 1 ? "s" : ""}`)(s.fiches.filter(f => liveCards(f, s).length).length)} · ${s.quizzes.length} quiz</span></button>`).join("")}</div>`;
  wire();
}
function home2() {
  if (updateReady) { updateReady = false; try { sessionStorage.setItem("upd-at", Date.now()); } catch (e) {} return location.reload(); }
  setFrame("Aujourd'hui", null, false);
  const exam = agItems().find(it => SUBJ[it.matiere] && testDays(it) >= 0 && testDays(it) <= 1);
  const ALWAYS = ["allemand"];
  const mine = s => !exam || s.key === exam.matiere || ALWAYS.includes(s.key);
  const due = todayDue(mine), allDone = due.every(d => d.read && d.ok);
  const more = allDone ? moreDue(mine) : [];
  const trapsLeft = allDone && !more.length && activePieges().some(p => mine(SUBJ[p.m]));
  const urg = s => Math.min(999, ...agItems().filter(it => it.matiere === s.key).map(testDays).filter(d => d >= 0));
  const isExam = s => exam && s.key === exam.matiere;
  const order = [...new Set(due.map(d => d.s))].sort((a, b) => isExam(b) - isExam(a) || urg(a) - urg(b));
  // Subjects with a quiz to do but nothing to revise today get a folded card too (no more « Autres quiz »).
  const extra = DATA.subjects.filter(s => mine(s) && !order.includes(s) && nextQuiz(s));
  const doneN = due.filter(d => d.read && d.ok).length;
  // The next step: in the first subject not finished, the first fiche not read yet, else its quiz.
  const stepOf = s => {
    const all = dueShown(due, s).all, q = nextQuiz(s) || lateQuiz(s);
    if (all.every(d => d.read && d.ok)) return null;
    const unread = all.find(d => !d.read && !d.trapOnly);
    if (unread) return { s, go: themeGo(s, unread.theme), label: `Relis la fiche « ${unread.theme} »`,
      sub: `${all.filter(d => d.read).length}/${all.length} fiches lues${q ? ` · ensuite le quiz n°${q.num}` : " · ton quiz est en préparation"}`, quiz: q };
    if (q) return { s, go: "q-" + q.id, label: `${nextQuiz(s) ? "Fais" : "Refais"} le quiz n°${q.num} · ${s.name}`, sub: `${q.questions.length} questions · environ ${Math.max(5, Math.round(q.questions.length / 2))} minutes` };
    return { s, wait: true };
  };
  const step = order.map(stepOf).find(Boolean) || null;
  const tests = agItems().filter(it => it.type === "controle" && testDays(it) >= 0 && (testDays(it) <= 7 || testDays(it) === SOMEDAY)).slice(0, 2);
  const devoirs = agItems().filter(it => it.type === "devoir" && !it.done && dayDiff(it.date) >= -14 && dayDiff(it.date) <= 7);
  const redo = DATA.scans.filter(sc => sc.status === "à refaire");
  const strip = it => { const d = testDays(it), s = SUBJ[it.matiere];
    return `<button class="strip" data-m="${s ? s.key : "agenda"}" data-go="${it.quiz && QUIZ[it.quiz] ? "q-" + esc(it.quiz) : "agenda"}">
      <span class="grow"><b>Contrôle · ${esc(s ? s.name : it.autre || "")} · ${!it.date ? "date à préciser" : d >= 2 && d <= 6 ? dayName(it.date) : dayLabel(it.date)}</b><small>${esc(it.title)}</small></span>
      ${it.date && d >= 2 ? `<span class="cd">dans ${d} jours</span>` : d === 1 ? `<span class="cd">demain</span>` : d === 0 ? `<span class="cd">aujourd'hui</span>` : ""}</button>`; };
  const state = d => d.read && d.ok ? ["ok", "✓", "réussie"] : d.read ? ["half", "◐", "fiche lue"] : ["todo", "○", "à revoir"];
  const card = s => {
    const { all, shown } = dueShown(due, s), q = nextQuiz(s), late = lateQuiz(s), ok = all.filter(d => d.read && d.ok).length;
    const open = s === (step && step.s) || ALWAYS.includes(s.key) || openGrp.has(s.key) || order.length + extra.length === 1;
    const sumQ = q ? "quiz n°" + esc(q.num) : late ? "refais le n°" + esc(late.num) : "quiz en préparation";
    const head = `<div class="grp-row${open ? " open" : ""}" role="button" tabindex="0" data-grp="${s.key}" aria-expanded="${open}"><h3 class="grp" data-m="${s.key}">${esc(s.name)}</h3>
      <span class="small">${all.length ? `${ok}/${all.length} ✓ · ` : ""}${sumQ}</span><span class="chev" aria-hidden="true">›</span></div>`;
    if (!open) return `<section class="card subj" data-m="${s.key}">${head}</section>`;
    return `<section class="card subj" data-m="${s.key}">${head}
      ${all.length ? `<ul class="due today nl">${shown.map(d => { const [c, ic, t] = state(d); return `<li class="lnk n-${c}" data-m="${d.s.key}" role="button" tabindex="0" data-go="${d.trapOnly ? "fp-" + esc(d.trapOnly.id) : themeGo(d.s, d.theme)}"><span class="st" title="${t}">${ic}</span><span class="grow">${esc(d.theme)}</span></li>
        ${d.traps.map(p => `<li class="lnk sub" data-m="${p.m}" role="button" tabindex="0" data-go="fp-${esc(p.id)}"><span class="grow">↳ ${esc(p.titre)}</span>${pips(p)}</li>`).join("")}`; }).join("")}</ul>
      ${all.length > shown.length ? `<button class="more" data-moredue="${s.key}">${all.length - shown.length > 1 ? `Voir les ${all.length - shown.length} autres notions` : "Voir l'autre notion"}</button>` : ""}` : ""}
      ${step && step.s === s ? "" : q ? `<button class="sec" data-go="q-${q.id}">Faire le quiz n°${esc(q.num)}</button>` : late ? `<button class="sec" data-go="q-${late.id}">Refaire le quiz n°${esc(late.num)}</button>` : ""}</section>`;
  };
  app.innerHTML = `${linkCard()}${askCard()}
    ${tests.map(strip).join("")}
    ${scansWaiting ? `<p class="small" id="scanwait">${scansWaiting > 1 ? `${scansWaiting} scans en attente` : "1 scan en attente"} d'envoi : ${scansWaiting > 1 ? "ils partiront" : "il partira"} dès que tu auras du réseau.</p>` : ""}
    ${due.length || extra.length ? `<section class="card mission"><div class="dayhead"><h2>${allDone ? "Bravo !" : "Ta prochaine étape"}</h2>${due.length ? `<span class="small" id="dayn">${doneN}/${due.length} faites</span>` : ""}</div>
      ${due.length ? `<div class="dayprog" aria-hidden="true"><div style="width:${Math.round(doneN / due.length * 100)}%"></div></div>` : ""}
      ${step && !step.wait ? `<button class="main step" data-go="${step.go}"><span>${esc(step.label)}</span><small>${esc(step.sub)}</small></button>
        ${step.quiz ? `<button class="link" data-go="q-${step.quiz.id}">ou fais tout de suite le quiz n°${esc(step.quiz.num)} ›</button>` : ""}`
      : step ? `<p class="small">Ton prochain quiz de ${esc(step.s.name)} arrive dans quelques minutes.</p>`
      : allDone && more.length ? `<p class="small">Ta liste du jour est faite. Continue avec les notions que tu ne maîtrises pas encore.</p><button class="main" id="moredue">Continuer : ${more.length} notion${more.length > 1 ? "s" : ""} de plus</button>`
      : trapsLeft ? `<p class="small">Il te reste des pièges à fermer : 3 bonnes réponses de suite, dans tes quiz.</p>`
      : due.length ? `<p class="sent ok">Tout est révisé pour aujourd'hui ✓</p>${extra.length ? `<p class="small">D'autres quiz t'attendent plus bas, si tu veux.</p>` : ""}`
      : `<p class="small">Rien à revoir aujourd'hui : un quiz t'attend plus bas.</p>`}
      ${due.length ? `<p class="legend"><span>○ à revoir</span><span>◐ fiche lue</span><span class="ok">✓ réussie</span></p>` : ""}</section>`
      : `<p class="empty">Rien à faire aujourd'hui. Bravo !</p>`}
    ${order.map(card).join("")}${extra.map(card).join("")}
    ${devoirs.length ? `<section class="card" data-m="agenda"><h2>Devoirs</h2><ul class="due">${devoirs.map(agRow).join("")}</ul></section>` : ""}
    ${redo.length ? `<section class="card"><h2>Scan à refaire</h2><ul class="due">${redo.map(sc => `<li><span class="badge low">${esc(sc.status)}</span><span>${esc(sc.label)}${sc.note ? `<br><span class="small">${esc(sc.note)}</span>` : ""}</span></li>`).join("")}</ul></section>` : ""}
    <p class="small">Mis à jour le ${esc(DATA.updated)}.</p>`;
  wire(); wireAgenda(home);
  app.querySelectorAll("[data-moredue]").forEach(b => b.onclick = () => { openDue.add(b.dataset.moredue); home(); });
  app.querySelectorAll("[data-grp]").forEach(b => b.onclick = () => { const k = b.dataset.grp; if (openGrp.has(k)) openGrp.delete(k); else openGrp.add(k); saveGrp(); home(); });
  const md = document.getElementById("moredue");
  if (md) md.onclick = () => { const st = dayState(); st.due.push(...more); saveDay(st); home(); };
}
function home() {
  if (home2On()) return home2();
  if (updateReady) { updateReady = false; try { sessionStorage.setItem("upd-at", Date.now()); } catch (e) {} return location.reload(); }
  setFrame("Tes révisions", null, false);
  const tomorrow = new Date(Date.parse(TODAY + "T12:00:00Z") + 864e5).toISOString().slice(0, 10);
  // The day before and the day of a test, home offers that subject first, plus Allemand (always on home);
  // the rest stays in Tes matières.
  const exam = agItems().find(it => SUBJ[it.matiere] && testDays(it) >= 0 && testDays(it) <= 1);
  const ALWAYS = ["allemand"];
  const mine = s => !exam || s.key === exam.matiere || ALWAYS.includes(s.key);
  const first = d => exam && d.s.key === exam.matiere ? 0 : 1;
  const due = todayDue(mine).sort((x, y) => first(x) - first(y)), left = due.filter(d => !d.ok), allDone = due.every(d => d.read && d.ok);
  // All ticked: next notions first; « Tout est révisé » only when nothing is left, open traps included.
  const more = allDone ? moreDue(mine) : [];
  const trapsLeft = allDone && !more.length && activePieges().some(p => mine(SUBJ[p.m]));
  // Under each subject of the day: its one quiz to do (a real 20-question quiz), or when the next one comes.
  const quizButton = (sub, multi, cls = "main") => { const q = nextQuiz(sub); return q ? `<button class="${cls}" data-go="q-${q.id}">Faire le quiz n°${esc(q.num)}${multi ? " · " + esc(sub.name) : ""}</button>`
    : lateQuiz(sub) ? `<p class="small">Ton prochain quiz${multi ? " de " + esc(sub.name) : ""} n'est pas encore prêt. En attendant, refais le dernier :</p>
      <button class="${cls}" data-go="q-${lateQuiz(sub).id}">Refaire le quiz n°${esc(lateQuiz(sub).num)}${multi ? " · " + esc(sub.name) : ""}</button>`
    : `<p class="small">Ton prochain quiz${multi ? " de " + esc(sub.name) : ""} arrive dans quelques minutes.</p>`; };
  const multi = new Set(due.map(d => d.s.key)).size > 1;  // one subject: its colour dot says it
  // One place to start: the subject with the nearest test (the test subject first on test days) gets the one big
  // button at the top; the other subjects fold into one line each, opened with a tap.
  const urg = s => Math.min(999, ...agItems().filter(it => it.matiere === s.key).map(testDays).filter(d => d >= 0));
  const order = [...new Set(due.map(d => d.s))].sort((a, b) => (exam && b.key === exam.matiere) - (exam && a.key === exam.matiere) || urg(a) - urg(b));
  const hero = order.find(s => nextQuiz(s) || lateQuiz(s)) || null;
  const isOpen = s => !multi || s === (hero || order[0]) || ALWAYS.includes(s.key) || openGrp.has(s.key);  // Allemand: always unfolded
  const doneN = due.filter(d => d.read && d.ok).length;
  const todo = DATA.subjects.filter(mine).map(nextQuiz).filter(Boolean);
  const rest = todo.filter(q => !due.some(d => d.s.key === QUIZ[q.id].subject.key));  // the others have their button in « À réviser aujourd'hui »
  const redo = DATA.scans.filter(s => s.status === "à refaire");  // only what asks something of her
  // Her « Ce que tu confonds encore » fiche (rewritten after each missed quiz) sits under the test reminder on
  // test days only; the rest of the time her traps lead to it.
  const confond = exam ? [FICHE[exam.matiere + "-a-revoir"]].filter(f => f && liveCards(f, f.subject).length) : [];
  const soon = agItems().filter(it => it.type === "devoir" ? !it.done && dayDiff(it.date) >= -14 && dayDiff(it.date) <= 7 : it.type === "controle" ? testDays(it) >= 0 && (testDays(it) <= 7 || testDays(it) === SOMEDAY) : dayDiff(it.date) >= 0 && dayDiff(it.date) <= 7);
  app.innerHTML = `${linkCard()}${askCard()}

// no longer loses a quiz, it is sent again the next time the app opens or comes back online.
const outbox = {
  all() { try { return JSON.parse(store.get("outbox")) || []; } catch (e) { return []; } },
  add(p) { store.set("outbox", JSON.stringify(outbox.all().filter(x => x.sid !== p.sid).concat([p]))); },
  drop(sid) { store.set("outbox", JSON.stringify(outbox.all().filter(x => x.sid !== sid))); },
  // only that version: a newer tick on the same line, queued meanwhile, stays
  done(p) { store.set("outbox", JSON.stringify(outbox.all().filter(x => x.sid !== p.sid || (x.at && x.at !== p.at)))); },
};
// Every write waits here: { sid, fn, args }. A quiz result is a saveResult payload (older entries have no fn).
// One sid per agenda line, so only her last tick (or answer) on it is kept and sent.
const opOf = p => p.fn ? p : { sid: p.sid, fn: "saveResult", args: [p] };
const offline = err => !navigator.onLine || err instanceof TypeError || /fetch|network|load failed/i.test(String(err && err.message));
function queue(fn, args, sid) {
  const p = { sid: sid || Date.now() + "-" + fn, fn, args, at: Date.now() + Math.random() };
  outbox.add(p);
  if (pendingSave || flushing || outbox.all().length > 1) return flushOutbox();  // keep the order: earlier ones first
  run(fn, ...args).then(() => outbox.done(p), err => { if (!offline(err)) outbox.done(p); });
}
const sumScore = sc => [Object.values(sc).reduce((a, x) => a + x[0], 0), Object.values(sc).reduce((a, x) => a + x[1], 0)];
// What is still waiting is shown as done: a fresh or offline copy of the data must not undo her ticks and results.
function applyOutbox(d) {
  outbox.all().map(opOf).forEach(({ fn, args }) => {
    const items = (d.agenda && d.agenda.items) || [];
    if (fn === "toggleAgenda") { const it = items.find(i => i.id === args[0]); if (it) it.done = args[1]; }
    else if (fn === "addAgenda") { if (d.agenda && !items.some(i => i.id === args[0])) items.push({ id: args[0], matiere: args[1], date: args[2], type: "controle", title: args[3], by: "elle" }); }
    else if (fn === "answerAgenda") { const it = items.find(i => i.id === args[0]); if (it && it.ask) { Object.assign(it, (it.ask.options[args[1]] || {}).set || {}); delete it.ask; } }
    else if (fn === "saveResult") d.subjects.forEach(s => s.quizzes.forEach(q => { if (q.id === args[0].quiz && !q.score) q.score = sumScore(args[0].scores); }));

}
let flushing = false;
function flushOutbox() {
  const box = outbox.all().map(opOf);
  if (flushing || pendingSave || linkBad || !box.length) return;
  flushing = true;
  let ok = false;
  box.reduce((pr, p) => pr.then(() => run(p.fn, ...p.args).then(r => {
    outbox.done(p);
    const q = p.fn === "saveResult" && QUIZ && QUIZ[p.args[0].quiz];
    if (q && r.recorded && !q.score) q.score = sumScore(p.args[0].scores);
  }, err => {
    if (/forbidden/.test(String(err && err.message))) linkBad = true;
    if (offline(err) || linkBad) throw err;  // stop: the rest goes, in order, at the next try
    outbox.done(p);  // refused by the server: it would be refused again
  })), Promise.resolve())
    .then(() => { ok = true; return typeof loadData === "function" ? loadData() : !stack.length && render(); })
    .catch(() => {})
    .finally(() => { flushing = false; if (ok && outbox.all().length) setTimeout(flushOutbox, 300); });  // queued meanwhile
}
setTimeout(flushOutbox, 1500);
addEventListener("online", flushOutbox);
document.addEventListener("visibilitychange", () => { if (!document.hidden) flushOutbox(); });
// Pull down from the top to refresh, in the home-screen app (Safari has its own pull-to-refresh).
(function () {
  const app = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone || window.PTR_TEST;
  const ptr = document.createElement("div"); ptr.id = "ptr"; document.body.appendChild(ptr);
  const say = (t, on) => { ptr.textContent = t; ptr.classList.toggle("show", on); };
  let y0 = null, d = 0, busy = false;
  addEventListener("touchstart", e => { y0 = app() && !busy && scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; d = 0; }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 === null) return;
    d = e.touches[0].clientY - y0;
    if (scrollY > 0 || d < 0) { y0 = null; return say("", false); }
    if (d > 20) say(d > 80 ? "↻ Relâche pour actualiser" : "↓ Tire pour actualiser", true);
  }, { passive: true });
  addEventListener("touchend", () => {
    if (y0 === null) return;
    y0 = null;
    if (d <= 80 || typeof loadData !== "function") return say("", false);
    busy = true; say("Actualisation…", true);
    flushOutbox(); flushScans();
    loadData().then(() => say("✓ À jour", true), () => say(navigator.onLine ? "Pas réussi, réessaie" : "Pas de réseau", true))
      .then(() => setTimeout(() => { say("", false); busy = false; }, 1200));
  });
})();
// Swipe from the left edge to go back, in the home-screen app (it has no browser gesture; Safari keeps its own).
(function () {
  const app = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone || window.SWB_TEST;
  const tip = document.createElement("div"); tip.id = "swb"; tip.textContent = "←"; document.body.appendChild(tip);
  const EDGE = 24, GO = 80;
  let x0 = null, y0 = 0, dx = 0;
  const draw = () => { const k = Math.min(Math.max(dx, 0), GO) / GO; tip.style.opacity = k; tip.style.transform = `translate(${k * 40 - 40}px, -50%) scale(${.7 + k * .3})`; tip.classList.toggle("go", dx > GO); };
  const stop = () => { x0 = null; dx = 0; draw(); };
  addEventListener("touchstart", e => { const t = e.touches[0]; x0 = app() && stack.length && e.touches.length === 1 && t.clientX < EDGE ? t.clientX : null; y0 = t.clientY; dx = 0; }, { passive: true });
  addEventListener("touchmove", e => {
    if (x0 === null) return;
    const t = e.touches[0]; dx = t.clientX - x0;
    if (Math.abs(t.clientY - y0) > 50 && Math.abs(t.clientY - y0) > dx) return stop();  // a vertical scroll, not a swipe
    draw();
  }, { passive: true });
  addEventListener("touchend", () => { if (x0 === null) return; const went = dx > GO; stop(); if (went && stack.length) back.onclick(); });
  addEventListener("touchcancel", stop);
})();
// Her link's key was refused (key rotated, or the site opened without her link): nothing can be saved.
let linkBad = false;
const LINK_MSG = "Ton lien de révisions a changé : ouvre le nouveau lien qu'on t'a envoyé pour enregistrer tes résultats.";
const linkCard = () => linkBad ? `<section class="card"><p class="sent ko" style="margin:0">${LINK_MSG}</p></section>` : "";
function result() {
  const { quiz, answers } = Z, total = quiz.questions.length;
  const themes = [...new Set(quiz.questions.map(q => q.t))];
  const n = answers.filter(a => a.ok).length;
  count.textContent = "Terminé"; fitTitle();
  const per = themes.map(t => { const xs = answers.filter(a => a.t === t); return { t, ok: xs.filter(a => a.ok).length, n: xs.length }; });
  const errs = answers.filter(a => !a.ok), pct = n / total;
  const verdict = pct >= .9 ? "Excellent, c'est acquis." : pct >= .7 ? "Bien. Revois les thèmes en rouge." : pct >= .5 ? "C'est en progrès. Relis les fiches des thèmes en rouge." : "Encore du travail : relis les fiches puis refais le quiz.";
  const texte = `${quizLabel(quiz)} : ${n}/${total}\n` + per.map(p => `${p.ok === p.n ? "OK" : "X"} ${p.t} ${p.ok}/${p.n}`).join("\n") +
    (errs.length ? `\n\nErreurs :\n` + errs.map(e => `- ${e.q} -> "${e.given}" (juste : ${e.right})`).join("\n") : "");
  const hits = {};
  answers.forEach(a => { if (a.p) (hits[a.p] = hits[a.p] || []).push(a.ok); });
  markOk(quiz.subject.key, per, !quiz.score || quiz.express ? hits : null);
  const first = !quiz.score && !quiz.express, best = first ? bestPct(quiz.subject, quiz.id) : null, r0 = best === null ? 0 : Math.round(best * total);
  const rec = !first ? "" : best === null ? `<p class="rec">Premier score en ${esc(quiz.subject.name)} : c'est ton record à battre.</p>`
    : pct > best + 1e-9 ? `<p class="rec win"><span class="star">★</span> Nouveau record en ${esc(quiz.subject.name)} !</p>`
    : n >= r0 ? `<p class="rec">Tu égales ton record (${r0}/${total}).</p>`
    : `<p class="rec">Ton record : <b>${r0}/${total}</b>. Plus que ${r0 - n} point${r0 - n > 1 ? "s" : ""} pour l'égaler.</p>`;
  app.innerHTML = `<section class="card">
      <p class="score">${n}<small> / ${total}</small></p>
      ${rec}
      <p style="margin:0">${esc(verdict)}</p>
      <div class="themes">${per.map(p => {
        const c = p.ok === p.n ? "var(--ok)" : p.ok / p.n >= .5 ? "var(--gold)" : "var(--bad)";
        return `<div class="trow"><span>${esc(p.t)}</span><span class="n">${p.ok}/${p.n}</span><div class="bar"><div style="width:${p.ok / p.n * 100}%;background:${c}"></div></div></div>`;
      }).join("")}</div>
      <div id="pgres"></div>
      <p class="sent" id="sent">Enregistrement de ton résultat…</p>
    </section>
    ${errs.length ? `<button class="main" id="retry">Corriger tes ${errs.length > 1 ? errs.length + " erreurs" : "erreur"}</button>
    <details class="card"><summary>À revoir (${errs.length})</summary><ol class="errs">${errs.map(e => `<li>${esc(e.q)}<br><s>${esc(e.given)}</s> → <b>${esc(e.right)}</b></li>`).join("")}</ol></details>` : ""}
    <button class="sec" id="again">Refaire le quiz</button>
    <button class="sec" id="home">Retour à tes révisions</button>`;
  if (errs.length) document.getElementById("retry").onclick = () => secondChance(quiz, errs.map(e => e.src));
  document.getElementById("again").onclick = () => { Z = { quiz, qs: quiz.questions, i: 0, answers: [] }; show(); };
  document.getElementById("home").onclick = () => go("");
  const payload = { quiz: quiz.id, matiere: quiz.subject.folder, num: quiz.num, scores: Object.fromEntries(per.map(p => [p.t, [p.ok, p.n]])), texte, pieges: hits, sid: Date.now() + "-" + quiz.id };
  outbox.add(payload);
  store.set("doneAt-" + quiz.subject.key, Date.now());
  // She sees the consequences at once, before the server answers (or offline): her notions' levels, her traps'
  // dots, the quiz marked done. The server applies the same rules; its answer then replaces these values.
  const before = {}, firstTry = !quiz.score || quiz.express;
  (DATA.pieges || []).forEach(t => { before[t.id] = t.streak || 0; });
  const touched = firstTry ? applyLocal(quiz, per, hits) : [];
  if (firstTry && QUIZ[quiz.id]) QUIZ[quiz.id].score = [n, total];
  const gain = t => t.done ? `<p class="pgwin">★ Piège fermé : ${esc(t.titre)}</p>` : (t.streak || 0) > (before[t.id] || 0) ? `<p class="pgwin">● +1 boule : ${esc(t.titre)}</p>` : `<p class="pglost">Boules remises à zéro : ${esc(t.titre)}</p>`;
  const showTraps = ts => { const pg = document.getElementById("pgres"); if (pg && ts.length) pg.innerHTML = `${ts.map(gain).join("")}<ul class="pieges">${ts.map(t => piegeRow(t)).join("")}</ul>`; };
  showTraps(touched);
  const save = () => {
    const el = document.getElementById("sent");
    if (el) { el.className = "sent"; el.textContent = "Enregistrement de ton résultat…"; }
    run("saveResult", payload).then(r => {
      pendingSave = null; outbox.drop(payload.sid);
      (r.pieges || []).forEach(t => { const k = (DATA.pieges || []).findIndex(x => x.id === t.id); if (k >= 0) DATA.pieges[k] = t; });
      if (r.pieges && r.pieges.length) showTraps(r.pieges);
      const sent = document.getElementById("sent");
      if (typeof loadData === "function") loadData().catch(() => {});  // the server's own values, quietly
      if (sent) { sent.className = "sent ok"; sent.textContent = r.recorded ? "Résultat enregistré ✓" : "Résultat enregistré ✓ (quiz refait : seule ta première tentative compte)"; }
    }).catch(err => {
      if (/forbidden/.test(String(err && err.message))) linkBad = true; else pendingSave = save;
      const sent = document.getElementById("sent");
      if (!sent) return;
      sent.className = "sent ko";
      if (linkBad) { sent.textContent = LINK_MSG; return; }
      sent.innerHTML = `Pas de connexion : résultat non enregistré. <button class="sec" id="resend" style="margin-top:6px">Réessayer</button>`;
      document.getElementById("resend").onclick = save;
    });
  };
  save();
}

let fetchedAt = 0;
function loadData() {
  fetchedAt = Date.now();
  return fetch(EXEC, { method: "POST", body: JSON.stringify({ key: KEY, fn: "data" }) }).then(r => r.json()).then(d => {
    if (!d || !d.subjects) throw new Error((d && d.error) || "data");
    const first = !DATA;
    store.set("data", JSON.stringify(d));
    index(d);
    airplaneBadge();
    if (first || !stack.length) render();  // never yank her out of a quiz or a fiche
  });
}
try { const d = JSON.parse(store.get("data")); if (d && d.subjects) { index(d); render(); } } catch (e) {}
if (!DATA) app.innerHTML = `<p class="empty">Chargement…</p>`;
loadData().catch(err => {
  if (DATA) { if (err.message === "forbidden") { linkBad = true; if (!stack.length) render(); } return; }
  app.innerHTML = !KEY || err.message === "forbidden"
    ? `<section class="card"><h2>Ouvre ton lien</h2><p class="small" style="font-size:15px">Pour voir tes révisions, ouvre le lien personnel qu'on t'a envoyé, ou tape ton code ici.</p>
        <input type="text" id="code" placeholder="Ton code" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="main" id="codeok">Valider</button></section>`
    : `<section class="card"><h2>Pas de connexion</h2><p class="small" style="font-size:15px">Vérifie ta connexion internet, puis réessaie.</p><button class="main" onclick="location.reload()">Réessayer</button></section>`;
  const ok = document.getElementById("codeok");  // the home-screen icon has its own memory: the code is typed once there
  if (ok) ok.onclick = () => { const v = document.getElementById("code").value.trim(); if (v) { location.hash = "k=" + v; location.reload(); } };
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - fetchedAt > 120000) loadData().catch(() => {}); });
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // A new version was just downloaded: reload now if she is on the home page, else on her way back to it.
  // A new service worker taking over (sw.js changed) means the same. At most once a minute, against a CDN
  // that still serves the old copy here and there.
  const hadSW = !!navigator.serviceWorker.controller;

    try { if (Date.now() - (+sessionStorage.getItem("upd-at") || 0) < 60000) return; } catch (e) {}
    if (stack.length || typeof Z !== "undefined" && Z && document.getElementById("act")) { updateReady = true; return; }

// Bottom of the page: the app and her data are on this phone, so it opens in airplane mode.
function airplaneBadge() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.ready.then(() => {
    if (!store.get("data")) return;
    const el = document.getElementById("avion") || (document.getElementById("root") || document.body).appendChild(Object.assign(document.createElement("p"), { id: "avion" }));  // inside the page, above the tab bar

}
airplaneBadge();
